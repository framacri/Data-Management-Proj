version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_imdb
    environment:
      POSTGRES_USER: imdb
      POSTGRES_PASSWORD: imdbpassword
      POSTGRES_DB: imdb
    # Neo4j riceve heap 1G + pagecache 1G (sotto). Sui default dell'immagine
    # Postgres girerebbe con shared_buffers=128MB e work_mem=4MB, e il
    # COUNT(DISTINCT) per gruppo della Q2 finirebbe in spill su disco: il
    # confronto misurerebbe la configurazione, non l'architettura.
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=64MB
      -c effective_cache_size=3GB
      -c max_parallel_workers_per_gather=2
      -c random_page_cost=1.1
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data # Map local data folder for easy loading
    restart: unless-stopped

  neo4j:
    image: neo4j:5.12
    container_name: neo4j_imdb
    environment:
      NEO4J_AUTH: neo4j/imdbpassword
      # Configure memory for bulk loading and queries
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4JLABS_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4jdata:/data
      - ./data:/var/lib/neo4j/import # Map for LOAD CSV
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
