services:
  postgres:
    image: postgres:15
    container_name: postgres_imdb
    environment:
      POSTGRES_USER: imdb
      POSTGRES_PASSWORD: imdbpassword
      POSTGRES_DB: imdb
    # Kept comparable to the Neo4j memory settings below. On the stock image
    # work_mem is 4MB, and the grouped COUNT(DISTINCT) in Q2 spills to disk:
    # the benchmark would measure the configuration, not the architecture.
    command: >
      postgres
      -c shared_buffers=1GB
      -c work_mem=64MB
      -c effective_cache_size=3GB
      -c max_parallel_workers_per_gather=2
      -c random_page_cost=1.1
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data
    # Lets `docker compose up -d --wait` return only once both are accepting
    # connections; without it the loaders fail when started immediately after.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imdb -d imdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  neo4j:
    image: neo4j:5.12
    container_name: neo4j_imdb
    environment:
      NEO4J_AUTH: neo4j/imdbpassword
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
      - ./data:/var/lib/neo4j/import # LOAD CSV reads from here
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
